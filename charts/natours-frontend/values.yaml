name: natours-frontend

replicaCount: 1

image:
  repository: "772097700150.dkr.ecr.us-east-1.amazonaws.com/natours-frontend"
  tag: latest

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    create: true
    path: /health
    periodSeconds: 5
    failureThreshold: 12

  liveness:
    create: true
    path: /health
    periodSeconds: 10
    failureThreshold: 3

  readiness:
    create: true
    path: /health
    periodSeconds: 5
    failureThreshold: 3

autoscaling:
  create: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
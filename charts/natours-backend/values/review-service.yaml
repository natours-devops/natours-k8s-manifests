name: review-service

replicaCount: 1

image:
  repository: 772097700150.dkr.ecr.us-east-1.amazonaws.com/natours-review-service
  tag: latest

port: 3003

service:
  port: 3003

config:
  NODE_ENV: development
  PORT: 3003
  TOUR_SERVICE_URL: http://tour-service:3002
  AUTH_SERVICE_URL: http://auth-service:3001

serviceAccount:
  create: false
  
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
    
probes:
  startup:
    create: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 12    # 12 × 5s = 60s max startup time
    successThreshold: 1

  liveness:
    create: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

  readiness:
    create: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 3
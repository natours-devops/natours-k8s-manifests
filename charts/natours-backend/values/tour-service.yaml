name: tour-service

replicaCount: 1

image:
  repository: 772097700150.dkr.ecr.us-east-1.amazonaws.com/natours-tour-service
  tag: latest

service:
  port: 3002
  
config: 
  NODE_ENV: development
  PORT: 3002
  
  AUTH_SERVICE_URL: http://auth-service:3001
  REVIEW_SERVICE_URL: http://review:3003
  FRONTEND_URL: http://localhost:5173 #change this later

serviceAccount:
  create: false
  
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
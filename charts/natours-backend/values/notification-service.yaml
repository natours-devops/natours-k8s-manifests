name: notification-service

replicaCount: 1

image:
  repository: 772097700150.dkr.ecr.us-east-1.amazonaws.com/natours-notification-service
  tag: latest

port: 3005

service:
  port: 3005
  
config: 
  NODE_ENV: development
  PORT: 3005
  GMAIL_USER: thanuj.kularathna2@gmail.com
  GMAIL_PASSWORD: dianiiitezyzuosw
  FRONTEND_URL: http://localhost:5173
  
  EMAIL_FROM: "thanujakularathna119@gmail.com"
  EMAIL_HOST: "sandbox.smtp.mailtrap.io"
  EMAIL_PORT: "2525"
  
  AWS_REGION: us-east-1
  SQS_BOOKING_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/772097700150/natours-booking-confirmed


serviceAccount:
  name: notification-service-sa
  create: true
  
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
    
probes:
  startup:
    create: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 12    # 12 × 5s = 60s max startup time
    successThreshold: 1

  liveness:
    create: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

  readiness:
    create: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 3